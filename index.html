<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDIRECTING...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFE500;
            font-family: 'Space Grotesk', monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .card {
            background-color: #ffffff;
            border: 4px solid #000000;
            box-shadow: 10px 10px 0px #000000;
            padding: 50px 60px;
            max-width: 600px;
            position: relative;
        }

        .tag {
            position: absolute;
            top: -18px;
            left: 30px;
            background-color: #FF3D00;
            border: 4px solid #000;
            color: #fff;
            font-weight: 900;
            font-size: 13px;
            padding: 2px 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .icon {
            font-size: 70px;
            display: block;
            margin-bottom: 20px;
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0px); }
            to { transform: translateY(-12px); }
        }

        h1 {
            font-size: 52px;
            font-weight: 900;
            color: #000;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 10px;
        }

        h1 span {
            color: #FF3D00;
            text-decoration: underline;
            text-decoration-thickness: 4px;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 700;
            color: #000;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 5px solid #000;
            padding-left: 12px;
            text-align: left;
        }

        .destination-box {
            background-color: #000;
            color: #FFE500;
            font-size: 13px;
            font-weight: 700;
            padding: 12px 20px;
            margin-bottom: 30px;
            text-align: left;
            word-break: break-all;
            letter-spacing: 1px;
        }

        .destination-box span {
            color: #fff;
            font-weight: 400;
        }

        /* Progress Bar */
        .progress-wrapper {
            margin-bottom: 25px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .progress-bar-outer {
            width: 100%;
            height: 28px;
            background-color: #fff;
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                #FF3D00,
                #FF3D00 15px,
                #000 15px,
                #000 30px
            );
            width: 0%;
            transition: width 0.1s linear;
            background-size: 42px 42px;
            animation: stripe-move 0.5s linear infinite;
        }

        @keyframes stripe-move {
            from { background-position: 0 0; }
            to { background-position: 42px 0; }
        }

        .countdown {
            font-size: 72px;
            font-weight: 900;
            color: #000;
            line-height: 1;
            margin-bottom: 5px;
            font-variant-numeric: tabular-nums;
        }

        .countdown-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #000;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: #000;
            color: #FFE500;
            font-family: 'Space Grotesk', monospace;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 14px 32px;
            border: 4px solid #000;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 6px 6px 0px #FF3D00;
            transition: all 0.1s;
            margin: 5px;
        }

        .btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0px #FF3D00;
        }

        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0px #FF3D00;
        }

        .btn-outline {
            background-color: #fff;
            color: #000;
            box-shadow: 6px 6px 0px #000;
        }

        .btn-outline:hover {
            box-shadow: 9px 9px 0px #000;
        }

        .btn-outline:active {
            box-shadow: 3px 3px 0px #000;
        }

        .divider {
            width: 100%;
            height: 4px;
            background: #000;
            margin: 25px 0;
        }

        .noise-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .corner-deco {
            position: fixed;
            font-size: 120px;
            font-weight: 900;
            color: rgba(0,0,0,0.06);
            line-height: 1;
            user-select: none;
        }

        .corner-deco.tl { top: -20px; left: -10px; }
        .corner-deco.br { bottom: -20px; right: -10px; }

        /* Redirect Done State */
        .redirect-done {
            display: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.3s ease-in-out 3;
        }
    </style>
</head>
<body>

    <div class="noise-bg"></div>
    <div class="corner-deco tl">→</div>
    <div class="corner-deco br">→</div>

    <div class="container">
        <div class="card">
            <div class="tag">⚡ Auto Redirect</div>

            <span class="icon">🚀</span>

            <h1>KAMU DI<span>PINDAH</span>KAN!</h1>

            <div class="divider"></div>

            <p class="subtitle">Menuju destinasi berikut:</p>

            <div class="destination-box">
                🔗 <span>URL Tujuan: </span>
                <span id="display-url">https://example.com</span>
            </div>

            <div class="progress-wrapper">
                <div class="progress-label">
                    <span>Progress</span>
                    <span id="percent-text">0%</span>
                </div>
                <div class="progress-bar-outer">
                    <div class="progress-bar-inner" id="progress-bar"></div>
                </div>
            </div>

            <div class="countdown" id="countdown">5</div>
            <div class="countdown-label">detik tersisa</div>

            <div>
                <a href="#" id="go-now-btn" class="btn" onclick="goNow()">
                    ⚡ Pergi Sekarang
                </a>
                <a href="#" id="cancel-btn" class="btn btn-outline" onclick="cancelRedirect()">
                    ✕ Batalkan
                </a>
            </div>
        </div>
    </div>

    <script>
        // =============================================
        // ✏️  GANTI URL DI SINI
        // =============================================
        const REDIRECT_URL = "https://example.com";
        const COUNTDOWN_SECONDS = 5; // durasi countdown (detik)
        // =============================================

        let timeLeft = COUNTDOWN_SECONDS;
        let intervalId = null;
        let cancelled = false;

        // Tampilkan URL di card
        document.getElementById('display-url').textContent = REDIRECT_URL;
        document.getElementById('go-now-btn').href = REDIRECT_URL;

        function updateProgress() {
            const elapsed = COUNTDOWN_SECONDS - timeLeft;
            const percent = Math.round((elapsed / COUNTDOWN_SECONDS) * 100);

            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('percent-text').textContent = percent + '%';
            document.getElementById('countdown').textContent = timeLeft;
        }

        function startCountdown() {
            updateProgress();

            intervalId = setInterval(() => {
                if (cancelled) {
                    clearInterval(intervalId);
                    return;
                }

                timeLeft--;
                updateProgress();

                if (timeLeft <= 0) {
                    clearInterval(intervalId);

                    // Final state
                    document.getElementById('progress-bar').style.width = '100%';
                    document.getElementById('percent-text').textContent = '100%';
                    document.getElementById('countdown').textContent = '✓';

                    // Redirect!
                    setTimeout(() => {
                        window.location.href = REDIRECT_URL;
                    }, 300);
                }
            }, 1000);
        }

        function goNow() {
            cancelled = true;
            clearInterval(intervalId);
            window.location.href = REDIRECT_URL;
        }

        function cancelRedirect() {
            cancelled = true;
            clearInterval(intervalId);

            document.getElementById('countdown').classList.add('shake');
            document.getElementById('countdown').textContent = '✕';
            document.getElementById('countdown').style.color = '#FF3D00';
            document.getElementById('countdown-label');
            document.getElementById('progress-bar').style.background = '#000';

            document.querySelector('.countdown-label').textContent = 'redirect dibatalkan';
            document.getElementById('cancel-btn').textContent = '↺ Mulai Ulang';
            document.getElementById('cancel-btn').setAttribute('onclick', 'restartRedirect()');
        }

        function restartRedirect() {
            cancelled = false;
            timeLeft = COUNTDOWN_SECONDS;
            document.getElementById('countdown').textContent = timeLeft;
            document.getElementById('countdown').style.color = '#000';
            document.getElementById('countdown').classList.remove('shake');
            document.querySelector('.countdown-label').textContent = 'detik tersisa';
            document.getElementById('cancel-btn').textContent = '✕ Batalkan';
            document.getElementById('cancel-btn').setAttribute('onclick', 'cancelRedirect()');

            document.getElementById('progress-bar').style.background = '';
            startCountdown();
        }

        // Start on load
        window.onload = () => {
            startCountdown();
        };
    </script>
</body>
</html>
